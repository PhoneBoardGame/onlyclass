<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바이러스 게임 · 교사 화면</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 교실 방역 상황판, 차분하고 또렷하게
   IDEA: 보건소 상황판 위에서 24명이 움직이는 반 전체 지도
   PICTURE: 장소별 칸에 학생 칩이 모이고 흩어지는 동선판
   COLOUR and TYPE: 흰 판 + 방역 파랑 + 감염 주황, IBM Plex Sans KR
   LAYOUT: 위 진행 바, 가운데 동선판, 오른쪽 기록 */
:root{color-scheme:light dark;--bg:light-dark(#F4F5F7,#0F1216);--card:light-dark(#FFFFFF,#181C22);--ink:light-dark(#121620,#E8EBEF);--mut:light-dark(#5B6472,#9AA3AF);--line:light-dark(#DDE1E6,#2A3039);--soft:light-dark(#EEF1F5,#222830);--blue:light-dark(#1D4ED8,#6E9BFF);--blueSoft:light-dark(#E8EEFD,#1A2747);--or:light-dark(#C2410C,#FF8B5C);--orSoft:light-dark(#FDEEE6,#3A2118);--multi:light-dark(#FBF3EE,#221A16);--ok:light-dark(#0F7A55,#4FD39C);--okSoft:light-dark(#E3F4EC,#14302A);--warn:light-dark(#9A6B00,#F2C14E);--warnSoft:light-dark(#FFF4D6,#30280F)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'IBM Plex Sans KR',system-ui,sans-serif;overflow-x:clip}
button,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 14px;min-height:44px;font-weight:600}
button:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff}
button.ghost{background:transparent}
select{min-height:40px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 10px}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:12px max(2vw,14px);background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font-size:20px;font-weight:700;white-space:nowrap}
.track{display:flex;gap:8px;align-items:stretch}
.tg{border:1.5px solid var(--line);border-radius:12px;padding:5px 7px 3px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tg>div{display:flex;gap:5px}.tg b{font-size:11px;color:var(--mut)}
.rd{display:flex;flex-direction:column;align-items:center;gap:2px;width:40px}
.rd span{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--soft);color:var(--mut)}
.rd.done span{background:var(--blueSoft);color:var(--blue)}.rd.cur span{background:var(--blue);color:#fff}
.rd i{font-style:normal;font-size:10px;font-weight:700;padding:0 3px;border-radius:4px;background:var(--orSoft);color:var(--or)}.rd i.no{visibility:hidden}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{padding:6px 14px;border-radius:999px;font-weight:700;background:var(--blueSoft);color:var(--blue);white-space:nowrap}
.pill.int{background:var(--orSoft);color:var(--or)}
.clock{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;min-width:86px;text-align:right;line-height:1}
.tog{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--mut);white-space:nowrap}
.tog input{width:18px;height:18px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;padding:18px max(2vw,14px);align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
h2{font-size:18px;margin:0 0 10px}
.sub{color:var(--mut);font-size:14px}
.ann{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.ann .card{padding:12px 16px}.ann .big{font-size:22px;font-weight:700}
.ann .dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}.ann .dark .sub{color:var(--bg);opacity:.75}
.grp{border-radius:16px;padding:12px;margin-bottom:12px}
.grp.sp{background:var(--soft)}.grp.mu{background:var(--multi)}
.grp h3{font-size:14px;margin:0 4px 8px;color:var(--mut)}
.places{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.place{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:120px}
.place .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.place .ph b{font-size:18px}.place .ph span{font-size:12px;color:var(--mut);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:32px;padding:3px 9px;border-radius:8px;border:1.5px solid transparent;background:var(--soft);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.chip.iso{background:var(--orSoft);color:var(--or)}
.chip.pos{border-color:var(--or);color:var(--or);background:var(--card)}
.chip.t-dis{border-color:var(--or)}.chip.t-lat{border-color:var(--or);border-style:dashed}.chip.t-car{background:var(--or);color:#fff}
.chip.t-cold{border-color:var(--warn)}
.chip small{font-size:10px;font-weight:700;padding:0 4px;border-radius:4px;background:var(--card);color:var(--mut)}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.seat{min-height:56px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);padding:6px 10px;text-align:left;display:flex;flex-direction:column;justify-content:center}
.seat b{font-size:17px}.seat span{font-size:12px;color:var(--mut);font-weight:500}
.seat.on{border-color:var(--blue);background:var(--blueSoft)}.seat.iso{border-color:var(--or);background:var(--orSoft)}
.bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden;margin:8px 0 12px}.bar>div{height:100%;background:var(--blue);transition:width .2s}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
.step{display:flex;align-items:center;gap:8px}.step button{min-height:34px;width:34px;padding:0}
.step b{width:22px;text-align:center}
.log{max-height:calc(100vh - 140px);overflow:auto;display:flex;flex-direction:column;gap:6px}
.log div{font-size:13px;padding:6px 8px;border-radius:8px;background:var(--soft)}
.log div.t{background:var(--warnSoft)}.log div em{font-style:normal;font-weight:700;color:var(--mut);margin-right:6px}
.verdict{background:var(--ink);color:var(--bg);border-radius:16px;padding:20px}
.verdict .n{font-size:56px;font-weight:700;line-height:1}
.curve{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:10px}
.curve div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:12px;color:var(--mut)}
.curve i{display:block;width:100%;background:var(--or);border-radius:6px 6px 0 0}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}td.r,th.r{text-align:right}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700}
.tag.w{background:var(--okSoft);color:var(--ok)}.tag.l{background:var(--orSoft);color:var(--or)}.tag.tm{background:var(--blueSoft);color:var(--blue)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.ov{position:fixed;inset:0;background:rgba(10,12,16,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.phone{width:380px;max-width:100%;max-height:calc(100vh - 32px);overflow:auto;background:var(--bg);border-radius:24px;border:1px solid var(--line)}
.phone .hd{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0}
.phone .bd{padding:14px;display:flex;flex-direction:column;gap:10px}
.tut{width:min(1100px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--bg);border-radius:20px;display:flex;flex-direction:column}
.tut .bd{padding:22px;display:flex;flex-direction:column;align-items:center;gap:16px}
.tut .em{font-size:56px;line-height:1}.tut h1{margin:0;font-size:34px}
.tgrid{display:grid;gap:12px;width:100%}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-height:0;font-weight:400}
.tcard .e{font-size:34px;line-height:1}.tcard b{font-size:20px;margin-top:4px}.tcard .l1{font-weight:600}.tcard .l2{color:var(--mut);font-size:14px}.tcard .more{font-size:13px;color:var(--blue);font-weight:600;margin-top:4px}
.tut .ft{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;background:var(--card);border-top:1px solid var(--line);position:sticky;bottom:0}
.dots{display:flex;gap:6px}.dots button{min-height:10px;height:10px;width:10px;padding:0;border-radius:999px;background:var(--line);border:0}.dots button.on{width:26px;background:var(--blue)}
.det{width:560px;max-width:100%;background:var(--card);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:10px}
.qrbox{background:#fff;padding:10px;border-radius:12px;display:inline-flex}
.seat.ai{border-style:dashed;color:var(--mut)}.seat.off{border-color:var(--or);background:var(--orSoft)}
.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mut);margin-top:6px}
@media(max-width:1000px){.wrap{grid-template-columns:minmax(0,1fr)}.log{max-height:260px}}
@media(max-width:640px){.places{grid-template-columns:minmax(0,1fr)}.clock{font-size:26px}.track .rd{width:30px}.track .rd span{width:26px;height:26px;font-size:13px}.rd i{font-size:9px}}
@media(prefers-reduced-motion:reduce){.bar>div{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <div class="brand">바이러스 게임</div>
    <div class="track" id="track"></div>
  </div>
  <div class="ctl">
    <span class="pill" id="phasePill">입장 대기</span>
    <span class="clock" id="clock">–</span>
    <button id="btnPause" aria-label="일시정지">⏸</button>
    <button class="pri" id="btnNext">다음 단계 ▶</button>
  </div>
  <div class="ctl">
    <label class="tog"><input type="checkbox" id="autoNext" checked> 시간 끝나면 자동 진행</label>
    <label class="tog"><input type="checkbox" id="teacherView"> 교사 정보 보기</label>
    <button class="ghost" id="btnTut">게임 설명</button>
    <button class="ghost" data-act="names">학생 이름</button>
  </div>
</header>
<div class="wrap">
  <main id="view"></main>
  <aside class="card">
    <h2>진행 기록</h2>
    <div class="sub" style="margin-bottom:8px">노란 줄은 교사 정보 보기를 켰을 때만 보여요</div>
    <div class="log" id="log"></div>
  </aside>
</div>
<div id="layer"></div>
<div id="namesLayer"></div>
<script>
{
const SLIDES = [
      { e: '🦠', title: '바이러스 게임', sub: '7라운드 동안 감염병을 피하거나, 퍼뜨려요', groups: [{ items: [
        ['🙂', '일반 시민', '게임이 끝날 때 감염되지 않고', '⭐ 15점 이상이면 승리', ['감염되지 않은 일반 시민은 모두 승리할 수 있어요.', '감염되지 않았어도 15점보다 낮으면 패배예요.', '기준 점수는 참가 인원에 따라 조금씩 달라져요.', '⭐ 점수 얻는 법 ①  학교: 갈 때마다 +1 → +2 → +3…', '⭐ 점수 얻는 법 ②  노래방 · PC방 · 식당: 장소마다 첫 방문 +3, 이후 +2', '⭐ 점수 얻는 법 ③  접촉: 성사될 때마다 +1', '⚠️ 1~3라운드, 4~6라운드에 학교를 못 가면 각각 −10점 · 집 · 병원은 0점', '감염돼도 병원에서 치료받으면 다시 감염 안 된 상태가 돼요.']],

        { label: '특수 장소', items: [

          ['🏥', '병원', '0점 · 모든 질병 치료', '병상 4개 · 증상 많은 순서로 입원', ['병상보다 사람이 많으면 증상이 많은 사람부터 들어가요. 증상 수가 같으면 무작위예요.', '병상이 없어 못 들어간 사람은 집으로 가요.', '치료는 그 라운드가 끝날 때 돼요.', '연구원은 병원에서 백신을 만들어요.', '최초 감염자는 증상만 감기 수준으로 줄고, 병원체는 남아요.']]

      { e: '🏫', title: '등교 규칙', groups: [{ items: [
        ['1️⃣', '1~3라운드', '이 중 1번은 꼭 학교에 가요', '3라운드가 마지막 기회', ['1, 2, 3라운드 중 언제 가도 괜찮아요.', '두 번 이상 가면 학교 점수가 계속 올라가요.']],

        ['🎒', '7라운드', '모두 학교에 모여요', '접촉 없이 결과 발표', ['7라운드 학교 방문도 점수에 들어가요.', '이 라운드에는 접촉과 능력을 쓸 수 없어요.']],

    if (!tg) { const pool = G.P.filter((p) => ok(p) && !p.testedNeg).sort((x,y) => (G.trace[y.i]+rnd()) - (G.trace[x.i]+rnd())); if (pool.length && G.trace[pool[0].i] > 0) tg = pool[0]; }
    if (tg) G.ev.push({type:'police', at:0.4 + rnd()*0.4, by:po.i, to:tg.i, fired:false});
  });
  addLog(r + '라운드 동선 공개 · 상호작용 시작', false);
}

function fireEvents(frac) {
  G.ev.forEach((e) => { if (e.fired || e.at > frac) return; e.fired = true;
    if (e.type === 'contact') { const a = G.P[e.a], b = G.P[e.b];
      if (G.pairs.has(pkey(a.i, b.i)) || G.reqs.some((q) => pkey(q.from, q.to) === pkey(a.i, b.i))) return;
      if (b.human && isOnline(b)) { G.reqs.push({id: ++G.reqId, from:a.i, to:b.i, place:e.place}); dirty = true; }
      else if (aiAccept(b, a)) acceptContact(a.i, b.i, e.place); else G.pairs.add(pkey(a.i, b.i)); }
    dirty = true;
    if (e.type === 'vacc') { G.P[e.to].vacc = true; G.P[e.by].vaccine = 0; addLog(G.P[e.by].no + '번 연구원이 ' + G.P[e.to].no + '번에게 백신 접종', true); }
    if (e.type === 'pcr') { G.noms.push({kind:'pcr', by:e.by, to:e.to}); G.pendPCR = {who:e.to, pos:G.startDis.has(e.to)}; addLog('진단 검사원 지목: ' + G.P[e.to].no + '번 유전자 증폭 검사', false); }
    if (e.type === 'police') { G.noms.push({kind:'police', by:e.by, to:e.to}); G.pendPol = e.to; G.P[e.to].lastPolice = G.round; addLog('방역 경찰 지목: ' + G.P[e.to].no + '번 다음 라운드 자가격리', false); }
  });
}

function settle() {
  fireEvents(2);
  const r = G.round, newDis = new Map(), newCold = new Set();
  G.reqs = []; G.aiResp = [];
  G.acc.forEach((e) => {
    [[e.a,e.b],[e.b,e.a]].forEach(([x,y]) => { const py = G.P[y];
      if (G.startDis.has(x) && !py.vacc && !G.startDis.has(y) && !newDis.has(y)) newDis.set(y, {from:x, place:e.place});
      if (G.startCold.has(x) && !G.startCold.has(y)) newCold.add(y); });
  });
  G.P.forEach((p) => { const l = G.loc[p.i];
    if (p.dis) {
      if (l === HOME) { if (p.dsym > 0) { p.dsym--; if (p.dsym === 0) { p.latent = true; addLog(p.no + '번 집에서 증상이 모두 사라짐 → 잠복기로 돌아감 (병원체는 남음)', true); } } }
      else if (p.latent) { if (l !== HOSP) { p.latent = false; p.dsym = 1; } }
      else if (l !== HOSP) p.dsym = Math.min(p.dsym + 1, 5);
    }
    if (p.csym > 0) { if (p.csym >= 3) p.csym = 0; else if (l === HOME) p.csym--; else if (l !== HOSP) p.csym++; if (p.csym === 0) p.cOrder = shuffle(['기침','오한','고열']); }
    if (l === HOSP) { if (p.role === 'carrier') { p.csym = 0; if (p.dsym > 1) { p.dsym = 1; addLog(p.no + '번 최초 감염자 병원: 증상이 감기 수준으로 완화 (병원체는 그대로)', true); } }
      if (p.role !== 'carrier') { if (p.dis) addLog(p.no + '번 병원 치료로 완치', true); p.dis = false; p.latent = false; p.dsym = 0; p.csym = 0; p.confirmed = false; }
      if (p.role === 'researcher') p.vaccine = 1; return; }
    if (newDis.has(p.i)) { const s = newDis.get(p.i); p.dis = true; p.latent = true; p.dsym = 0; p.by = s.from; G.chain.push({r, from:s.from, to:p.i, place:s.place}); addLog(G.P[s.from].no + '번 → ' + p.no + '번 감염 (' + PL[s.place] + ')', true); }
    if (newCold.has(p.i) && p.csym === 0) p.csym = 1;
  });
  G.curve.push(G.P.filter((p) => p.dis).length);
  if (r === 3 && G.P.some((p) => p.role === 'officer' && !p.human)) {
    const cnt = {}; G.chain.filter((c) => c.r <= 3 && RISKY.includes(c.place)).forEach((c) => cnt[c.place] = (cnt[c.place] || 0) + 1);
    const mx = Math.max(0, ...Object.values(cnt));
    if (mx > 0) { const top = shuffle(RISKY.filter((pl) => cnt[pl] === mx))[0]; G.closed = top; G.closeInfo = {place:top, count:mx, cnt};
      addLog('방역관 확인: 1~3라운드 다중이용시설 감염 ' + RISKY.map((pl) => PL[pl] + ' ' + (cnt[pl] || 0) + '건').join(', '), true);
      addLog('방역관이 ' + PL[top] + ' 폐쇄 (4~6라운드)', false); }
    else { G.closeInfo = {place:null, count:0, cnt}; addLog('방역관 확인: 다중이용시설 감염 없음 · 폐쇄하지 않음', false); }
  }
}

function startFinal() {
  G.round = 7; G.phase = 'final'; G.t = 0; G.dur = 0;
  G.P.forEach((p) => { p.forced = false; p.schN++; p.score += p.schN; p.hist.push({r:7, place:SCHOOL, pts:p.schN, c:0}); });
  if (G.pendPCR) { const {who, pos} = G.pendPCR; G.pcrShow = {who, pos}; if (pos) G.P[who].confirmed = true; G.pendPCR = null; addLog('유전자 증폭 검사 결과: ' + G.P[who].no + '번 ' + (pos ? '양성' : '음성'), false); }
  addLog('7라운드 · 전원 등교 (접촉 없음)', false);
}

function finish() {
  G.phase = 'result'; G.done = true;
  G.P.forEach((p) => { p.pen = (p.sch1 ? 0 : 10) + (p.sch2 ? 0 : 10); p.final = p.score - p.pen; });
  G.inf = G.P.filter((p) => p.dis).length;
  G.carrierWin = G.inf >= carrierLine();
  addLog('결과 공개 · 최종 감염자 ' + G.inf + '명 · ' + (G.carrierWin ? '최초 감염자 승리' : '방역 팀 승리'), false);
}

function next() {
  if (!G) return;
  if (G.phase === 'lobby') { buildPlayers(); startRound(1); }
  else if (G.phase === 'place') endPlace();
  else if (G.phase === 'interact') { settle(); if (G.round === 3 && G.P.some((p) => p.role === 'officer' && p.human)) startOfficer(); else if (G.round < 6) startRound(G.round + 1); else startFinal(); }
  else if (G.phase === 'officer') { endOfficer(); startRound(4); }
  else if (G.phase === 'final') finish();
  else if (G.phase === 'result') { newGame(); }
  lastSig = ''; dirty = true; render();
}

if (!roomCode) { roomCode = genCode(); try { localStorage.setItem('vg_room', roomCode); } catch (e) {} }
const joinUrl = () => new URL('join.html?room=' + roomCode, location.href).href;
const isOnline = (p) => !!(seats[p.no] && seats[p.no].online);
const pkey = (a, b) => Math.min(a, b) + '-' + Math.max(a, b);
const aiAccept = (resp, reqr) => reqr.confirmed ? rnd() < 0.05 : (isVis(reqr) ? rnd() < 0.35 : rnd() < 0.9);
const timedPhase = () => G && (G.phase === 'place' || G.phase === 'interact' || G.phase === 'officer');
const netSig = () => Object.keys(seats).map((k) => k + (seats[k].online ? 'o' : 'x') + (seats[k].name || '')).join(',') + hostStatus;

function acceptContact(a, b, place) {
  G.pairs.add(pkey(a, b));
  const A = G.P[a], B = G.P[b];
  A.score++; B.score++; A.hist[A.hist.length - 1].c++; B.hist[B.hist.length - 1].c++;
  G.contacts[place] = (G.contacts[place] || 0) + 1; G.acc.push({a, b, place}); dirty = true;
}
function aiRespond() {
  const due = G.aiResp.filter((x) => G.t >= x.at); if (!due.length) return;
  G.aiResp = G.aiResp.filter((x) => G.t < x.at);
  due.forEach((x) => { const q = G.reqs.find((r) => r.id === x.id); if (!q) return;
    G.reqs = G.reqs.filter((r) => r !== q);
    if (aiAccept(G.P[q.to], G.P[q.from])) acceptContact(q.from, q.to, q.place); else G.pairs.add(pkey(q.from, q.to)); });
  dirty = true;
}
function officerCounts() { const cnt = {}; G.chain.filter((c) => c.r <= 3 && RISKY.includes(c.place)).forEach((c) => cnt[c.place] = (cnt[c.place] || 0) + 1); return cnt; }
function startOfficer() {
  G.phase = 'officer'; G.t = 0; G.dur = settings.dur;
  G.closeInfo = {place:null, count:0, cnt:officerCounts(), decided:false};
  addLog('방역관이 1~3라운드 감염 기록을 확인하는 중', false); dirty = true;
}
function officerDecide(place) {
  if (place && RISKY.includes(place)) { G.closed = place; G.closeInfo.place = place; G.closeInfo.count = G.closeInfo.cnt[place] || 0; addLog('방역관이 ' + PL[place] + ' 폐쇄 (4~6라운드)', false); }
  else addLog('방역관이 폐쇄하지 않기로 했어요', false);
  G.closeInfo.decided = true; next();
}
function endOfficer() { if (G.closeInfo && !G.closeInfo.decided) { G.closeInfo.decided = true; addLog('방역관이 시간 안에 정하지 않아 폐쇄 없음', false); } }

function onAct(no, d) {
  if (!G || !G.P.length) return;
  const p = G.P[no - 1]; if (!p || !p.human) return;
  const r = G.round, ph = G.phase, b = d.to != null ? G.P[d.to] : null;
  if (d.a === 'place') {
    if (ph !== 'place' || p.forced) return;
    if (![HOME, SCHOOL, HOSP, ...RISKY].includes(d.place) || closedNow(d.place, r)) return;
    const e = G.ev[p.i]; e.place = d.place; if (e.at === Infinity) e.at = Math.min(0.999, G.t / G.dur);
  } else if (d.a === 'rapid') {
    if (p.rapidUsed || !timedPhase()) return;
    p.rapidUsed = true; p.rapid = (p.dis && !p.latent) ? '양성' : '음성'; p.rapidRound = r;
    addLog(p.no + '번 신속항원검사 → ' + p.rapid + (p.dis && p.latent ? ' (잠복기라 안 잡힘)' : ''), true);
  } else if (d.a === 'req') {
    if (ph !== 'interact' || !b || b === p) return;
    const l = G.loc[p.i]; if (l === HOME || G.loc[b.i] !== l) return;
    const k = pkey(p.i, b.i); if (G.pairs.has(k) || G.reqs.some((q) => pkey(q.from, q.to) === k)) return;
    const q = {id: ++G.reqId, from:p.i, to:b.i, place:l}; G.reqs.push(q);
    if (!b.human || !isOnline(b)) G.aiResp.push({at: G.t + 0.8 + rnd() * 1.5, id:q.id});
  } else if (d.a === 'resp') {
    if (ph !== 'interact') return;
    const q = G.reqs.find((x) => x.id === d.id && x.to === p.i); if (!q) return;
    G.reqs = G.reqs.filter((x) => x !== q);
    if (d.ok) acceptContact(q.from, q.to, q.place); else G.pairs.add(pkey(q.from, q.to));
  } else if (d.a === 'vacc') {
    if (ph !== 'interact' || p.role !== 'researcher' || !p.vaccine || G.loc[p.i] === HOSP || !b || b === p || G.loc[b.i] !== G.loc[p.i] || b.vacc) return;
    b.vacc = true; p.vaccine = 0; addLog(p.no + '번 연구원이 ' + b.no + '번에게 백신 접종', true);
  } else if (d.a === 'pcr') {
    if (ph !== 'interact' || p.role !== 'tester' || !b || b === p || G.noms.some((n) => n.kind === 'pcr' && n.by === p.i)) return;
    G.noms.push({kind:'pcr', by:p.i, to:b.i}); G.pendPCR = {who:b.i, pos:G.startDis.has(b.i)}; addLog('진단 검사원 지목: ' + b.no + '번 유전자 증폭 검사', false);
  } else if (d.a === 'police') {
    if (ph !== 'interact' || p.role !== 'police' || !b || b === p || b.lastPolice === r - 1 || G.noms.some((n) => n.kind === 'police' && n.by === p.i)) return;
    G.noms.push({kind:'police', by:p.i, to:b.i}); G.pendPol = b.i; b.lastPolice = r; addLog('방역 경찰 지목: ' + b.no + '번 다음 라운드 자가격리', false);
  } else if (d.a === 'officer') {
    if (ph !== 'officer' || p.role !== 'officer' || G.closeInfo.decided) return;
    officerDecide(d.place || null); return;
  }
  dirty = true; lastSig = '';
}

function studentView(no) {
  const base = {t:'view', seat:no, tut: tutShown ? {page:tutPage, open:tutOpen} : null, cfg:{beds:settings.beds, win:winScore(), line:carrierLine(), lineName:lineName(), n:settings.n}};
  if (!G || !G.P.length || G.phase === 'lobby') return Object.assign(base, {phase:'lobby', name:seatName(no)});
  const p = G.P[no - 1]; if (!p) return Object.assign(base, {phase:'nogame'});
  const r = G.round, ph = G.phase;
  const me = {no:p.no, name:p.name, role:p.role, score:p.score, sym:visible(p), forced:p.forced, sch1:p.sch1, sch2:p.sch2, schN:p.schN, visits:Object.keys(p.visits),
    rapid: p.rapidUsed ? {res:p.rapid, r:p.rapidRound} : null, vaccine:p.vaccine, bedless: p.bedless === r && ph !== 'place', noChoice: p.noChoice === r && ph !== 'place'};
  if (p.role === 'carrier') me.partners = G.P.filter((x) => x.role === 'carrier' && x !== p).map((x) => x.no);
  if (p.role === 'officer' && G.closeInfo) me.closeInfo = {cnt:G.closeInfo.cnt, place:G.closeInfo.place, decided:!!G.closeInfo.decided};
  const v = Object.assign(base, {phase:ph, round:r, left: timedPhase() ? Math.max(0, Math.ceil(G.dur - G.t)) : null, paused, me});
  v.ann = {infected: [1,3,5].includes(r) ? G.announced : null,
    pcr: G.pcrShow ? {no:G.P[G.pcrShow.who].no, name:G.P[G.pcrShow.who].name, pos:G.pcrShow.pos} : null,
    police: G.polShow != null ? {no:G.P[G.polShow].no, name:G.P[G.polShow].name} : null,
    closed: G.closed && r >= 4 && r <= 6 ? G.closed : null};
  if (ph === 'place') { const e = G.ev[p.i]; v.choice = e.at === Infinity ? null : e.place; }
  if (ph === 'interact') {
    const l = G.loc[p.i]; v.place = l; v.bedlessN = (G.bedless || []).length;
    v.here = l === HOME ? [] : G.P.filter((b) => b !== p && G.loc[b.i] === l).map((b) => {
      const k = pkey(p.i, b.i), inc = G.reqs.find((q) => q.from === b.i && q.to === p.i), out = G.reqs.find((q) => q.from === p.i && q.to === b.i);
      const done = G.acc.some((a) => pkey(a.a, a.b) === k);
      return {i:b.i, no:b.no, name:b.name, sym:visible(b), pos:b.confirmed && b.dis, vacc: p.role === 'researcher' ? b.vacc : false, st: done ? 'done' : inc ? 'in' : out ? 'out' : G.pairs.has(k) ? 'no' : '', req: inc ? inc.id : null};
    });
    v.noms = G.noms.map((n) => ({kind:n.kind, no:G.P[n.to].no, name:G.P[n.to].name, mine:n.by === p.i}));
    if (p.role === 'tester' || p.role === 'police') v.all = G.P.filter((b) => b !== p).map((b) => ({i:b.i, no:b.no, name:b.name, pos:b.confirmed && b.dis, neg:b.testedNeg, lastPol:b.lastPolice === r - 1}));
    v.myC = p.hist.length ? p.hist[p.hist.length - 1].c : 0;
  }
  if (ph === 'final') v.pen = (p.sch1 ? 0 : 10) + (p.sch2 ? 0 : 10);
  if (ph === 'result') {
    const ranked = G.P.slice().sort((a, b) => b.final - a.final);
    v.res = {inf:G.inf, carrierWin:G.carrierWin, final:p.final, pen:p.pen, rank:ranked.indexOf(p) + 1, n:G.P.length, dis:p.dis,
      win: p.role === 'carrier' ? G.carrierWin : (p.role !== 'citizen' ? !G.carrierWin : (!p.dis && p.final >= winScore())),
      carriers: G.P.filter((x) => x.role === 'carrier').map((x) => x.no + '번 ' + x.name), hist:p.hist};
  }
  return v;
}

function sendTo(no, msg) { const s = seats[no]; try { if (s && s.conn && s.conn.open) s.conn.send(msg); } catch (e) {} }
let netCount = 0;
function netTick() {
  netCount++;
  if (netCount % 3 === 0) {
    for (const no in seats) { const s = seats[no]; if (!s.online) continue;
      const j = JSON.stringify(studentView(+no));
      if (j !== s.last) { s.last = j; sendTo(no, {t:'v', j}); } }
  }
  if (netCount % 30 === 0) {
    const now = Date.now();
    for (const no in seats) { const s = seats[no]; if (!s.conn) continue;
      sendTo(no, {t:'ping', ts:now});
      if (s.online && now - (s.lastSeen || 0) > 9000) { s.online = false; addLog(no + '번 연결 끊김', false); lastSig = ''; } }
  }
}

function setHost(msg, ok) { hostStatus = msg; hostOk = ok; lastSig = ''; }
function openRoom() {
  try { peer = new Peer(PREFIX + roomCode, {debug:1}); } catch (e) { setHost('PeerJS를 불러오지 못했어요. 인터넷 연결을 확인하세요.', false); return; }
  peer.on('open', () => { idRetry = 0; setHost('방이 열렸어요 · QR을 찍고 들어오세요', true); });
  peer.on('connection', (conn) => {
    conn.on('data', (d) => onData(conn, d));
    conn.on('close', () => closed(conn)); conn.on('error', () => closed(conn));
  });
  peer.on('disconnected', () => { setHost('중계 서버와 끊김 · 다시 연결 중…', false); setTimeout(() => { try { peer.reconnect(); } catch (e) {} }, 1500); });
  peer.on('error', (e) => {
    if (e.type === 'unavailable-id') { idRetry++; setHost('방 코드를 다시 잡는 중… (' + idRetry + ')', false); try { peer.destroy(); } catch (_) {}
      if (idRetry <= 10) setTimeout(openRoom, 3000); else setHost('방 코드를 잡지 못했어요. [새 방 코드 만들기]를 눌러 주세요.', false); }
    else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(e.type)) setHost('네트워크 문제 · 다시 연결 중…', false);
  });
}
function closed(conn) {
  const no = conn.seat;
  if (no && seats[no] && seats[no].conn === conn) { seats[no].online = false; seats[no].conn = null; addLog(no + '번 연결 끊김', false); lastSig = ''; }
}
function onData(conn, d) {
  if (!d || typeof d !== 'object') return;
  if (d.t === 'hello') {
    const taken = Object.keys(seats).filter((k) => seats[k].online).map(Number);
    try { conn.send({t:'info', n:settings.n, taken, started: !!(G && G.P.length)}); } catch (e) {}
    return;
  }
  if (d.t === 'join') {
    const no = +d.seat, cur = seats[no];
    if (!(no >= 1 && no <= settings.n)) { try { conn.send({t:'reject', reason:'없는 자리 번호예요.'}); } catch (e) {} return; }
    if (cur && cur.token !== d.token && cur.online) { try { conn.send({t:'reject', reason:no + '번 자리는 이미 다른 학생이 쓰고 있어요. 선생님께 말해 주세요.'}); } catch (e) {} return; }
    const name = String(d.name || '').trim().slice(0, 10);
    if (cur && cur.conn && cur.conn !== conn) { try { cur.conn.close(); } catch (e) {} }
    seats[no] = {name: name || (cur && cur.name) || '', token:d.token, conn, online:true, lastSeen:Date.now(), last:null};
    conn.seat = no;
    if (G && G.P.length && G.P[no - 1]) { const p = G.P[no - 1]; if (!p.human) addLog(no + '번 학생이 AI 대신 참여', false); p.human = true; if (seats[no].name) p.name = seats[no].name; }
    addLog(no + '번 ' + (cur ? '다시 접속' : '입장') + (name ? ' (' + name + ')' : ''), false);
    try { conn.send({t:'welcome', seat:no}); } catch (e) {}
    lastSig = ''; return;
  }
  const no = conn.seat; if (!no || !seats[no] || seats[no].conn !== conn) return;
  const s = seats[no]; s.lastSeen = Date.now(); if (!s.online) { s.online = true; lastSig = ''; }
  if (d.t === 'pong') return;
  if (d.t === 'act') onAct(no, d);
}
document.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-kick],[data-act="newroom"]'); if (!b) return;
  if (b.dataset.kick) { const no = +b.dataset.kick; if (!confirm(no + '번 자리를 비울까요? 그 학생은 다시 자리를 골라야 해요.')) return;
    sendTo(no, {t:'kicked'}); try { seats[no].conn && seats[no].conn.close(); } catch (e) {} delete seats[no]; lastSig = ''; render(); }
  else if (b.dataset.act === 'newroom') { if (!confirm('새 방 코드를 만들면 들어와 있는 학생들은 새 QR을 다시 찍어야 해요. 계속할까요?')) return;
    for (const k in seats) sendTo(k, {t:'closed'});
    try { localStorage.removeItem('vg_room'); } catch (e) {} setTimeout(() => location.reload(), 300); }
});
window.addEventListener('beforeunload', (e) => { if (G && G.P.length && G.phase !== 'result') { e.preventDefault(); e.returnValue = ''; } });
async function keepAwake() { try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
keepAwake();

newGame(); render(); openRoom();
}
</script>
