<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>바이러스 게임</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#F4F5F7,#0F1216);--card:light-dark(#FFFFFF,#181C22);--ink:light-dark(#121620,#E8EBEF);--mut:light-dark(#5B6472,#9AA3AF);--line:light-dark(#DDE1E6,#2A3039);--soft:light-dark(#EEF1F5,#222830);--blue:light-dark(#1D4ED8,#6E9BFF);--blueSoft:light-dark(#E8EEFD,#1A2747);--or:light-dark(#C2410C,#FF8B5C);--orSoft:light-dark(#FDEEE6,#3A2118);--multi:light-dark(#FBF3EE,#221A16);--ok:light-dark(#0F7A55,#4FD39C);--okSoft:light-dark(#E3F4EC,#14302A)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'IBM Plex Sans KR',system-ui,sans-serif;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;padding:0 14px}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button:disabled{opacity:.4}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.top b{font-size:15px}.clock{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#C9A227;margin-right:6px}.dot.ok{background:var(--ok)}.dot.bad{background:var(--or)}
main{max-width:760px;margin:0 auto;padding:14px 14px 40px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.sub{color:var(--mut);font-size:13px}
h2{font-size:20px;margin:2px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.big{font-size:20px;font-weight:700}
.warn{background:var(--orSoft);color:var(--or);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
.note{background:var(--blueSoft);color:var(--blue);border-radius:12px;padding:10px 12px;font-size:14px}
.grp{border-radius:16px;padding:10px;background:var(--soft)}.grp.mu{background:var(--multi)}
.grp h3{font-size:13px;margin:0 4px 8px;color:var(--mut)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:84px;padding:12px;text-align:left;font-weight:400}
.opt b{font-size:18px}.opt .p{font-size:18px;font-weight:700;margin-top:auto}.opt.sel{background:var(--blue);border-color:var(--blue);color:#fff}.opt.sel .sub{color:#DCE5FB}
.person{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.person .n{flex:1}.person b{font-size:16px}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--orSoft);color:var(--or)}
.tag.g{background:var(--okSoft);color:var(--ok)}.tag.b{background:var(--blueSoft);color:var(--blue)}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.seats button{min-height:48px;padding:0;font-size:17px}
.seats button.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.seats button.taken{opacity:.3}
.role{border:2px dashed var(--line);border-radius:16px;padding:14px;text-align:center;user-select:none;-webkit-user-select:none;touch-action:none;background:var(--card)}
.role.show{border-style:solid;border-color:var(--or)}
.role .nm{font-size:24px;font-weight:700}
input.txt{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:17px;background:var(--card)}
.ov{position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:20;display:flex;align-items:center;justify-content:center;padding:12px}
.sheet{width:100%;max-width:640px;max-height:calc(100vh - 24px);overflow:auto;background:var(--bg);border-radius:20px;display:flex;flex-direction:column}
.sheet .bd{padding:16px;display:flex;flex-direction:column;gap:8px}
.tc{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;font-weight:400;width:100%}
.tc .e{font-size:28px;width:36px;text-align:center}.tc b{font-size:16px}
.det{background:var(--card);border-radius:20px;padding:18px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:8px}
.score{display:inline-block;background:#F2C14E;color:#2A1F00;font-weight:700;border-radius:999px;padding:2px 10px;font-size:16px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#F2C14E;color:#2A1F00;font-weight:700;font-size:22px;padding:8px 18px;border-radius:999px;z-index:30;animation:up 1.4s ease-out forwards}
@keyframes up{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-30px)}}
@media(prefers-reduced-motion:reduce){.toast{animation:none}}
.netbar{background:var(--or);color:#fff;font-weight:700;text-align:center;padding:8px;border-radius:12px}
.verdict{background:var(--ink);color:var(--bg);border-radius:18px;padding:18px}
</style>
</head>
<body>
<div class="top"><div><span class="dot" id="dot"></span><b id="who">바이러스 게임</b> <span class="sub" id="sub"></span></div><div style="display:flex;align-items:center;gap:10px"><button id="helpBtn" data-a="help" style="display:none;min-height:36px;padding:0 10px">📖 설명</button><span class="score" id="score" style="display:none"></span><div class="clock" id="clock"></div></div></div>
<div id="toast"></div>
<main id="app"></main>
<div id="layer"></div>
<script>
{
const SLIDES = [
      { e: '🦠', title: '바이러스 게임', sub: '7라운드 동안 감염병을 피하거나, 퍼뜨려요', groups: [{ items: [
        ['🙂', '일반 시민', '게임이 끝날 때 감염되지 않고', '⭐ 반 평균 점수 이상이면 승리', ['감염되지 않은 일반 시민은 모두 승리할 수 있어요.', '기준 점수는 게임이 끝날 때 반 전체의 평균 점수예요. 평균보다 낮으면 패배예요.', '⭐ 점수 얻는 법 ①  학교: 갈 때마다 +1 → +2 → +3 (최대 +3)', '⭐ 점수 얻는 법 ②  노래방 · PC방 · 식당: 장소마다 첫 방문 +3, 이후 +2', '⭐ 점수 얻는 법 ③  접촉: 성사될 때마다 +1', '⚠️ 1~3라운드, 4~6라운드에 학교를 못 가면 각각 −10점 · 집 · 병원은 0점', '감염돼도 병원에서 치료받으면 다시 감염 안 된 상태가 돼요.']],
        ['🦠', '최초 감염자', '게임이 끝날 때 감염자가', '과반(24명 중 13명) 이상이면 승리', ['점수와 상관없이 감염자 수로만 승패가 정해져요.', '1라운드에는 증상이 없어요.', '병원에 가면 증상이 감기 수준으로 줄지만, 병원체는 그대로예요.']],

      { e: '📍', title: '장소', groups: [
        { label: '특수 장소', items: [

        { label: '다중이용시설', multi: true, items: [

    if (it) det = '<div class="ov"><div class="det" role="dialog" aria-label="세부 설명"><div style="display:flex;gap:10px;align-items:center"><span style="font-size:38px">' + it[0] + '</span><b style="font-size:22px">' + it[1] + '</b></div><div class="card" style="background:var(--soft);border:0"><b>' + tx(it[2]) + '</b><div class="sub">' + tx(it[3]) + '</div></div>' + it[4].map((t) => '<div>• ' + tx(t) + '</div>').join('') + (T.open ? '' : '<button data-a="detx">닫기</button>') + '</div></div>'; }
  const foot = V.tut ? '<div class="sub" style="text-align:center;padding:10px">👩‍🏫 선생님이 넘기면 같이 넘어가요</div>'
    : '<div style="display:flex;gap:8px;padding:10px 16px 14px;position:sticky;bottom:0;background:var(--bg)"><button data-a="hprev" style="flex:1"' + (T.page === 0 ? ' disabled' : '') + '>‹ 이전</button><button data-a="hnext" style="flex:1"' + (T.page >= SLIDES.length - 1 ? ' disabled' : '') + '>다음 ›</button><button class="pri" data-a="hclose" style="flex:1">게임으로</button></div>';
  const tabs = V.tut ? '' : '<div style="display:flex;gap:6px;overflow-x:auto;padding:10px 16px 0">' + SLIDES.map((s, i) => '<button data-hp="' + i + '" style="min-height:40px;padding:0 10px;flex:none;font-size:20px;' + (i === T.page ? 'background:var(--blue);border-color:var(--blue)' : '') + '" aria-label="' + (i + 1) + '쪽">' + s.e + '</button>').join('') + '</div>';
  setLayer('<div class="ov"><div class="sheet" role="dialog" aria-label="게임 설명"><div class="row" style="padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1"><b>📖 게임 설명</b><span class="sub">' + (T.page + 1) + ' / ' + SLIDES.length + (V.tut ? '' : ' · 게임은 계속 진행 중') + '</span></div>' + tabs + '<div class="bd">' + body + '</div>' + foot + '</div></div>' + det, resetScroll);
}

// ---------- 입력 ----------
document.addEventListener('pointerdown', (e) => { if (e.target.closest('[data-hold]')) { holding = true; e.preventDefault(); render(true); } });
['pointerup', 'pointercancel'].forEach((n) => document.addEventListener(n, () => { if (holding) { holding = false; render(true); } }));
document.addEventListener('contextmenu', (e) => { if (e.target.closest('[data-hold]')) e.preventDefault(); });
document.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.seat) { pickSeat = +d.seat; const nm = $('nm') && $('nm').value; render(true); if (nm != null && $('nm')) $('nm').value = nm; return; }
  if (d.a === 'join') { const name = ($('nm') && $('nm').value.trim()) || ''; me = {seat:pickSeat, name, token: Math.random().toString(36).slice(2) + Date.now().toString(36)}; save('vg_player_' + room, me); err = null; send({t:'join', seat:me.seat, name, token:me.token}); return; }
  if (d.a === 'leave') { del('vg_player_' + room); location.reload(); return; }
  if (d.a === 'room') { const v = $('rc').value.toUpperCase().trim(); if (v.length === 4) location.href = location.pathname + '?room=' + v; return; }
  if (d.a === 'rapid') { act({a:'rapid'}); return; }
  if (d.a === 'detx') { localDet = null; renderLayer(); return; }
  if (d.det) { if (!(V.tut && V.tut.open)) { localDet = d.det; renderLayer(); } return; }
  if (d.a === 'help') { help = {page: help ? help.page : 0}; localDet = null; renderLayer(true); return; }
  if (d.a === 'hclose') { help = null; localDet = null; renderLayer(); return; }
  if (d.a === 'hprev' && help) { help.page = Math.max(0, help.page - 1); localDet = null; renderLayer(true); return; }
  if (d.a === 'hnext' && help) { help.page = Math.min(SLIDES.length - 1, help.page + 1); localDet = null; renderLayer(true); return; }
  if (d.hp != null && help) { help.page = +d.hp; localDet = null; renderLayer(true); return; }
  if (d.place) { act({a:'place', place:d.place}); V.choice = d.place; render(true); return; }
  if (d.vote) { act({a:'vote', to:+d.vote}); V.myVote = +d.vote; render(true); return; }
  if (d.mask) { act({a:'mask', on: d.mask === '1'}); V.mask = d.mask === '1'; render(true); return; }
  if (d.req) { act({a:'req', to:+d.req}); return; }
  if (d.resp) { act({a:'resp', id:+d.resp, ok: d.ok === '1'}); return; }
  if (d.vacc) { act({a:'vacc', to:+d.vacc}); return; }
  if (d.pick) { pickTarget = +d.pick; render(true); return; }
  if (d.confirm && pickTarget != null) { act({a:d.confirm, to:pickTarget}); pickTarget = null; return; }
  if (d.close != null) { act({a:'officer', place:d.close || null}); return; }
});

if (room) ensurePeer();
render(true);
}
</script>
</body>
</html>
